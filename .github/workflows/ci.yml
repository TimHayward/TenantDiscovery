name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Test with coverage
        run: pnpm -r --if-present run test --coverage --coverage.reporter=text --coverage.reporter=lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            **/coverage/**
          if-no-files-found: error
          retention-days: 14

      - name: Lint
        run: pnpm run lint

      # The dashboard build enforces the eager entry payload ceiling
      # (ENTRY_JS_BUDGET_BYTES in artifacts/m365-dashboard/vite.config.ts) and
      # exits non-zero when it is exceeded, so this step is the bundle budget.
      - name: Build and enforce bundle budget
        run: pnpm run build
