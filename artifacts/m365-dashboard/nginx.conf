server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container healthcheck endpoint
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # API reverse proxy. No URI on proxy_pass so the /api prefix is
    # preserved (Express mounts its routes under /api).
    location /api/ {
        proxy_pass http://api-server:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tenant scans and exports can take a while
        proxy_read_timeout 300s;
    }

    # Hashed Vite build assets are content-addressed — cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
